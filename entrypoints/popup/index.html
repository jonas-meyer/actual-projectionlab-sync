<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actual → ProjectionLab</title>
    <link rel="stylesheet" href="/theme.css" />
    <style>
      body { width: 380px; margin: 0; padding: 14px; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      header strong { font-size: 14px; }
      header span { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      #status { margin-top: 10px; color: var(--pl-subdued); white-space: pre-wrap; }
      p { display: flex; align-items: center; gap: 10px; margin-bottom: 0; }
      button.link { padding: 0; border: 0; background: none; font-size: 12px;
        color: var(--pl-primary); text-decoration: underline; }
    </style>
  </head>
  <body>
    <header>
      <strong>Actual → ProjectionLab</strong>
      <span>
        <button id="backfill" type="button">Backfill</button>
        <button id="sync" class="primary" type="button">Sync Now</button>
      </span>
    </header>
    <div id="status"></div>
    <p>
      <button id="map-accounts" type="button">Map accounts</button>
      <button id="open-options" class="link" type="button">Settings</button>
    </p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
